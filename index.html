<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c4e9e9">
  <title>デジタルスタンプ大作戦!下大谷古墳群</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif; background: #f1f9f5; color: #244b47; }
    header { background: #c4e9e9; padding: 17px 14px; text-align: center; font-size: clamp(18px, 4.5vw, 25px); font-weight: 800; }
    main { width: min(100%, 760px); margin: 0 auto; padding: 20px 16px 36px; }
    .mission { font-size: clamp(18px, 4.4vw, 24px); font-weight: 800; line-height: 1.55; margin: 0 0 15px; }
    .mission-image { width: 100%; display: block; height: auto; border-radius: 8px; background: #deeee4; }
    .camera-button { display: block; width: 100%; margin: 20px 0 14px; padding: 18px 16px; border: 0; border-radius: 12px; background: #79b8a0; color: #163c33; font: inherit; font-size: clamp(19px, 4.5vw, 24px); font-weight: 800; text-align: center; cursor: pointer; box-shadow: 0 4px 0 #51927c; }
    .camera-button:active { transform: translateY(3px); box-shadow: 0 1px 0 #51927c; }
    .note { margin: 0; font-size: clamp(14px, 3.6vw, 17px); line-height: 1.65; font-weight: 700; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>
  <header>デジタルスタンプ大作戦!下大谷古墳群</header>
  <main>
    <p class="mission">ミッション：こんな感じで見晴らしの良い写真を撮ろう！</p>
    <img class="mission-image" src="image_mission.jpg" alt="ミッションで撮影する写真のお手本">
    <button class="camera-button" type="button" id="cameraButton">カメラを起動</button>
    <input id="cameraInput" type="file" accept="image/*" capture="environment" aria-label="カメラで写真を撮影">
    <p class="note">※撮影した写真はガチャチャレンジに必要です。必ず保存しておいてください。</p>
  </main>
  <script>
    const cameraButton = document.getElementById('cameraButton');
    const cameraInput = document.getElementById('cameraInput');
    cameraButton.addEventListener('click', () => cameraInput.click());
    // 撮影ファイルはサイトへ送信・アップロードしません。
    // 保存場所やカメラの起動動作はスマホ・タブレットのOS／ブラウザによって異なります。
  </script>
</body>
</html>
